<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immich Triage</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      body { @apply bg-gray-100 min-h-screen font-sans; }
      .card { @apply bg-white rounded-lg shadow-md p-6 mb-4; }
      h1 { @apply text-2xl font-semibold text-red-900 mb-4; }
      h2 { @apply text-lg font-medium text-gray-700 mb-3; }
      label { @apply block text-sm font-medium text-gray-700 mb-1; }
      input[type="url"], input[type="password"] {
        @apply w-full border border-gray-300 rounded-md px-3 py-2 text-sm
               focus:outline-none focus:ring-2 focus:ring-red-400;
      }
      .btn { @apply px-4 py-2 rounded-md text-sm font-medium transition cursor-pointer; }
      .btn-primary { @apply bg-red-800 text-white hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed; }
      .btn-secondary { @apply bg-gray-200 text-gray-700 hover:bg-gray-300; }
      .error { @apply text-red-600 text-sm; }
      .album-card {
        @apply bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden
               hover:shadow-md hover:border-red-300 transition cursor-pointer;
      }
    </style>
  </head>
  <body>
    <div class="container mx-auto px-4 py-8 max-w-4xl">

      <!-- Login panel -->
      <div id="login-panel" class="card hidden">
        <h1>Immich Triage</h1>
        <p class="text-gray-500 text-sm mb-6">
          Connect to your Immich instance to start triaging photos.
        </p>
        <div class="space-y-4 max-w-md">
          <div>
            <label for="instance-url">Instance URL</label>
            <input type="url" id="instance-url" placeholder="https://immich.example.com" />
          </div>
          <div>
            <label for="api-key">API Key</label>
            <input type="password" id="api-key" placeholder="Your Immich API key" />
            <p class="text-xs text-gray-500 mt-1">
              Immich → Account Settings → API Keys
            </p>
          </div>
          <p id="login-error" class="error hidden"></p>
          <button id="connect-btn" class="btn btn-primary" onclick="connect()">Connect</button>
        </div>
      </div>

      <!-- Albums panel -->
      <div id="albums-panel" class="hidden">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="mb-0">Immich Triage</h1>
            <p id="instance-label" class="text-sm text-gray-500 mt-1"></p>
          </div>
          <button class="btn btn-secondary" onclick="disconnect()">Disconnect</button>
        </div>

        <p id="albums-loading" class="card text-center text-gray-500 py-12 hidden">
          Loading albums…
        </p>
        <p id="albums-error" class="error card hidden"></p>

        <h2 id="albums-heading" class="hidden"></h2>
        <div id="albums-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4"></div>
      </div>

    </div>

    <script>
      const STORAGE_KEY = 'immich-triage-config';

      function getConfig() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
        catch { return null; }
      }

      function saveConfig(baseUrl, apiKey) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ baseUrl, apiKey }));
      }

      function clearConfig() {
        localStorage.removeItem(STORAGE_KEY);
      }

      function show(id) { document.getElementById(id).classList.remove('hidden'); }
      function hide(id) { document.getElementById(id).classList.add('hidden'); }
      function setText(id, text) { document.getElementById(id).textContent = text; }

      async function immichFetch(baseUrl, apiKey, path) {
        const url = baseUrl.replace(/\/$/, '') + path;
        const res = await fetch(url, {
          headers: { 'x-api-key': apiKey, 'Accept': 'application/json' }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        return res;
      }

      async function connect() {
        const baseUrl = document.getElementById('instance-url').value.trim();
        const apiKey = document.getElementById('api-key').value.trim();

        if (!baseUrl || !apiKey) {
          setText('login-error', 'Please fill in both fields.');
          show('login-error');
          return;
        }

        const btn = document.getElementById('connect-btn');
        btn.textContent = 'Connecting…';
        btn.disabled = true;
        hide('login-error');

        try {
          // Validate credentials before saving
          await immichFetch(baseUrl, apiKey, '/api/albums');
          saveConfig(baseUrl, apiKey);
          await showAlbumsPanel(baseUrl, apiKey);
        } catch (e) {
          setText('login-error', 'Could not connect: ' + e.message);
          show('login-error');
          btn.textContent = 'Connect';
          btn.disabled = false;
        }
      }

      function disconnect() {
        clearConfig();
        hide('albums-panel');
        document.getElementById('instance-url').value = '';
        document.getElementById('api-key').value = '';
        hide('login-error');
        show('login-panel');
      }

      async function showAlbumsPanel(baseUrl, apiKey) {
        hide('login-panel');
        show('albums-panel');
        setText('instance-label', baseUrl);

        show('albums-loading');
        hide('albums-error');
        hide('albums-heading');
        document.getElementById('albums-grid').innerHTML = '';

        try {
          const res = await immichFetch(baseUrl, apiKey, '/api/albums');
          const albums = await res.json();
          hide('albums-loading');

          albums.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

          setText('albums-heading', `${albums.length} album${albums.length === 1 ? '' : 's'}`);
          show('albums-heading');

          const grid = document.getElementById('albums-grid');
          for (const album of albums) {
            grid.appendChild(buildAlbumCard(album));
          }

          // Load thumbnails with auth after cards are in the DOM
          loadThumbnails(baseUrl, apiKey);
        } catch (e) {
          hide('albums-loading');
          setText('albums-error', 'Failed to load albums: ' + e.message);
          show('albums-error');
        }
      }

      function buildAlbumCard(album) {
        const div = document.createElement('div');
        div.className = 'album-card';
        div.dataset.albumId = album.id;

        const hasThumbnail = !!album.albumThumbnailAssetId;

        div.innerHTML = `
          <div class="relative bg-gray-100 w-full aspect-square flex items-center justify-center">
            ${hasThumbnail
              ? `<img data-thumb="${escAttr(album.albumThumbnailAssetId)}"
                      class="w-full h-full object-cover hidden" alt="" />`
              : ''}
            <div class="thumb-placeholder w-full h-full flex items-center justify-center text-gray-300">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14
                     M6 6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
            </div>
          </div>
          <div class="p-2">
            <p class="text-sm font-medium text-gray-800 truncate" title="${escAttr(album.albumName)}">${escHtml(album.albumName)}</p>
            <p class="text-xs text-gray-500">${album.assetCount} photo${album.assetCount === 1 ? '' : 's'}</p>
          </div>
        `;

        return div;
      }

      async function loadThumbnails(baseUrl, apiKey) {
        const imgs = document.querySelectorAll('#albums-grid img[data-thumb]');
        // Load concurrently but limit parallelism to avoid overwhelming the server
        const BATCH = 6;
        for (let i = 0; i < imgs.length; i += BATCH) {
          await Promise.all(
            Array.from(imgs).slice(i, i + BATCH).map(img => loadOneThumbnail(baseUrl, apiKey, img))
          );
        }
      }

      async function loadOneThumbnail(baseUrl, apiKey, img) {
        const assetId = img.dataset.thumb;
        const url = `${baseUrl.replace(/\/$/, '')}/api/assets/${assetId}/thumbnail?size=preview`;
        try {
          const res = await fetch(url, { headers: { 'x-api-key': apiKey } });
          if (!res.ok) return;
          const blob = await res.blob();
          img.src = URL.createObjectURL(blob);
          img.classList.remove('hidden');
          img.closest('.relative').querySelector('.thumb-placeholder').style.display = 'none';
        } catch { /* leave placeholder */ }
      }

      function escHtml(str) {
        return str.replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
        );
      }

      function escAttr(str) {
        return String(str).replace(/"/g, '&quot;');
      }

      // Enter key support in login form
      ['instance-url', 'api-key'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
          if (e.key === 'Enter') connect();
        });
      });

      // Restore session on load
      (function init() {
        const config = getConfig();
        if (config) {
          showAlbumsPanel(config.baseUrl, config.apiKey);
        } else {
          show('login-panel');
        }
      })();
    </script>
  </body>
</html>
