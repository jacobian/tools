name: refresh-canyons
on:
  # 1 am every day
  schedule:
    - cron: "0 1 * * *"
  # or when manually triggered
  workflow_dispatch:

jobs:
  refresh_bookmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - run: uv run bin/fetch-canyons
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: "🤖"
          commit_message: "🪢 update canyons"